name: Weekly OKSO Update

on:
  schedule:
    # Еженедельно, понедельник 22:00 UTC = вторник 01:00 МСК.
    # ОКСО (ОК 009-2016) стабилен с 2017-07-01 — ежедневный опрос источника избыточен.
    #
    # Сетка экосистемы:
    # ОКВЭД2 05:00 / ОКПД2 11:30 / ОКТМО 12:00 / ОКЕИ 13:00 / ОКАТО 14:00 /
    # ОКОГУ 15:00 / ОКОПФ 16:00 / ОКФС 17:00 / ОКВ 18:00 / ОКСМ 19:00 /
    # ОКОФ 20:00 / ОКЗ 21:00 (ежедневно) / ОКСО 22:00 пн (еженедельно).
    - cron: '0 22 * * 1'
  workflow_dispatch:          # ручной запуск

jobs:
  sync-and-trigger:
    runs-on: ubuntu-24.04     # пин образа: убирает notice про миграцию ubuntu-latest -> 26.04
    timeout-minutes: 10
    permissions:
      contents: write         # встроенный токен Actions для коммита
    env:
      # API-токен Kaggle НОВОГО образца (CLI >= 1.8.0).
      # Repository secret: KAGGLE_API_TOKEN_OKSO (внутри чистый токен).
      # В Kaggle токен называется gha-okso.
      # Kaggle CLI читает переменную окружения KAGGLE_API_TOKEN напрямую.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_OKSO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI с поддержкой API-токенов (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python - <<'EOF'
          import re, subprocess
          out = subprocess.check_output(["kaggle", "--version"], text=True).strip()
          m = re.search(r"(\d+)\.(\d+)", out)
          assert m and tuple(map(int, m.groups())) >= (1, 8), \
              f"нужен kaggle CLI >= 1.8.0 для API-токенов, получен: {out}"
          print("OK: kaggle CLI поддерживает API-токены")
          EOF

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/okso-classifier-downloader -p ./output
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -30
          echo ""
          echo "--- Диагностика тетрадки (если есть) ---"
          for f in ./output/okso_data/diag/okso_diagnostics.json ./output/*.log ./output/*.txt ./output/__notebook*.ipynb; do
            [ -f "$f" ] && { echo ">>> $f (last 50 lines) >>>"; tail -n 50 "$f"; echo "<<< $f <<<"; echo ""; }
          done || true

      - name: Copy web files to repo root (авто-детект SRC, не падает, ставит флаг)
        id: copy
        run: |
          # ВАЖНО ПРО ОКСО:
          # Тетрадка ОКСО пишет публикуемые артефакты в конвенционный подпуть
          # /kaggle/working/okso_data/web/ (как ОКЗ/ОКОФ/ОКОПФ/ОКФС/ОКАТО/ОКТМО/ОКОГУ/ОКСМ),
          # а НЕ в голый /kaggle/working/web/ (как ОКВ). Основной кандидат SRC —
          # ./output/okso_data/web. Авто-детект оставлен для устойчивости на случай
          # будущего патча тетрадки; ГОЛЫЙ ./output как SRC НЕ используется НИКОГДА
          # (грабли ОКЕИ v1.2).
          #
          # Маркер правильного каталога — наличие okso.json.
          SRC=""
          for cand in ./output/okso_data/web ./output/web; do
            if [ -f "$cand/okso.json" ]; then SRC="$cand"; break; fi
          done

          if [ -z "$SRC" ]; then
            echo "::warning::не найден каталог с okso.json ни в ./output/okso_data/web, ни в ./output/web (тетрадка, вероятно, упала на critical или писала не туда)"
            echo "--- дерево ./output для отладки пути ---"
            find ./output -type f 2>/dev/null | head -60 || true
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "SRC=$SRC"
            MISSING=0
            for f in okso.json okso.json.gz okso_meta.json okso_meta.json.gz; do
              if [ -f "$SRC/$f" ]; then
                cp "$SRC/$f" "./$f"
                echo "copied $f"
              else
                echo "::warning::MISSING $f в $SRC"
                MISSING=$((MISSING+1))
              fi
            done
            if [ "$MISSING" -gt 0 ]; then
              echo "Отсутствует $MISSING из 4 файлов - коммит пропущен, сайт остаётся на последней хорошей версии"
              echo "FILES_OK=false" >> "$GITHUB_ENV"
            else
              echo "Все 4 файла на месте"
              echo "FILES_OK=true" >> "$GITHUB_ENV"
              echo "--- okso_meta.json (редакция / warnings / critical) ---"
              python -m json.tool okso_meta.json || cat okso_meta.json
            fi
          fi

      - name: Commit and push changes
        if: env.FILES_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add okso.json okso.json.gz okso_meta.json okso_meta.json.gz
          if git diff --cached --quiet; then
            echo "Изменений нет - данные уже актуальны"
          else
            # ОКСО-специфика: source_date в мете = дата введения стандарта
            # (2017-07-01, константа source_date_origin=standard_known).
            # Для еженедельных коммитов берём дату снимка generated_at (YYYY-MM-DD),
            # чтобы каждая неделя была различима в истории. Если нужна дата
            # обновления источника — смотрите source_modified в мете.
            # Однострочный python -c (БЕЗ heredoc!) — heredoc внутри $() в run:|
            # ломает терминатор из-за отступов YAML и даёт exit 2. Не менять.
            SOURCE_DATE=$(python -c "import json; m=json.load(open('okso_meta.json')); print((m.get('generated_at') or '')[:10] or m.get('source_date') or '?')" 2>/dev/null || echo '?')
            git commit -m "Auto-update: OKSO data from kernel output (source $SOURCE_DATE) [skip ci]"
            git push
            echo "Изменения запушены"
          fi

      - name: Trigger new notebook run (fire-and-forget, всегда)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/okso-classifier-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"